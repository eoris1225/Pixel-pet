<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a3550">
<title>Pixel Pet</title>
<link rel="preload" href="fonts/ramche.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixelroborobo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/silver.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Every screen is one 180x320 pixel canvas-sized page, scaled up by whole numbers (like the prototype) -->
<div id="frame">
<div id="app" data-pet="mochi">
  <div id="stage" aria-label="펫이 있는 화면. 펫을 누르면 반응하고, 꾹 눌러서 들 수 있어요.">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
  </div>
  <div id="speech"><div id="pet-bubble" class="bubble" hidden></div><div id="world-bubble" class="bubble soft" hidden></div></div>

  <header id="hud" class="box">
    <canvas id="hud-face" width="29" height="20"></canvas>
    <div class="hud-main">
      <div class="hud-row"><b id="hud-lv" class="num">Lv.1</b><span id="hud-burn" class="burn" hidden>버닝</span><span id="hud-next"></span></div>
      <div class="bar"><i id="hud-bar"></i></div>
    </div>
  </header>

  <nav id="sidetab" class="open">
    <div class="tabs box">
      <button id="tab-stats" class="ibtn" aria-label="공부 시간과 과목"><canvas width="11" height="11"></canvas></button>
      <button id="tab-todo" class="ibtn" aria-label="공부 계획표"><canvas width="11" height="11"></canvas></button>
      <button id="tab-settings" class="ibtn" aria-label="설정"><canvas width="11" height="11"></canvas></button>
    </div>
    <button id="tab-toggle" class="box" aria-label="메뉴 열고 닫기"><canvas width="3" height="5"></canvas></button>
  </nav>

  <div id="controls">
    <button id="btn-start" class="ctl"><span class="dot-rec" hidden></span><span class="ctl-main">시작</span></button>
    <button id="btn-rest" class="ctl" disabled><span class="ctl-main">휴식</span></button>
    <button id="btn-end" class="ctl" disabled><span class="ctl-main">끝</span></button>
  </div>

  <!-- screens -->
  <section class="screen" id="scr-select">
    <header class="scr-head"><button class="back ibtn" data-back aria-label="뒤로">&lt;</button><h2>캐릭터 선택</h2></header>
    <div class="scr-body">
      <div class="sel-bubble bubble static" id="sel-bubble">마음에 드는 친구를 눌러 봐!</div>
      <div class="sel-row" id="sel-row"></div>
      <div class="sel-info box" id="sel-info" hidden></div>
      <p class="sel-note" id="sel-note" hidden>바꿔도 이전 캐릭터의 데이터는 그대로 남아요.</p>
      <button id="sel-ok" class="btn primary wide" disabled>확인</button>
    </div>
  </section>

  <section class="screen" id="scr-stats">
    <header class="scr-head"><button class="back ibtn" data-back aria-label="뒤로">&lt;</button><h2>통계</h2></header>
    <div class="scr-body" id="stats-body"></div>
  </section>

  <section class="screen" id="scr-todo">
    <header class="scr-head"><button class="back ibtn" data-back aria-label="뒤로">&lt;</button><h2>투두리스트</h2></header>
    <div class="scr-body" id="todo-body"></div>
  </section>

  <section class="screen" id="scr-settings">
    <header class="scr-head"><button class="back ibtn" data-back aria-label="뒤로">&lt;</button><h2>설정</h2></header>
    <div class="scr-body" id="settings-body"></div>
  </section>

  <section class="screen" id="scr-tutorial">
    <header class="scr-head"><button class="back ibtn" data-back aria-label="뒤로">&lt;</button><h2>튜토리얼</h2></header>
    <div class="scr-body" id="tutorial-body"></div>
  </section>

  <section class="screen" id="scr-inventory">
    <header class="scr-head"><button class="back ibtn" data-back aria-label="뒤로">&lt;</button><h2>인벤토리</h2></header>
    <div class="scr-body" id="inventory-body"></div>
  </section>

  <div id="modal" hidden><div class="modal-card box" role="dialog" aria-modal="true"></div></div>

  <div id="coach" hidden>
    <div class="coach-dim"></div>
    <div class="coach-card bubble"><p></p><small>눌러서 계속 &gt;</small></div>
    <div class="coach-catch"></div>
  </div>

  <div id="toast" hidden></div>
</div>
</div>

<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/pet.js"></script>
<script src="js/items.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
