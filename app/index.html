<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c2032">
<title>Pixel Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-pet="mochi">
  <!-- the world (sky, land, sign) and the pet on top of it -->
  <div id="stage" aria-label="펫이 있는 화면. 펫을 누르면 반응하고, 꾹 눌러서 들 수 있어요.">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
  </div>
  <div id="speech"><div id="pet-bubble" class="bubble" hidden></div><div id="world-bubble" class="bubble small" hidden></div></div>

  <header id="hud">
    <canvas id="hud-face" width="29" height="22"></canvas>
    <div class="hud-main">
      <div class="hud-row"><b id="hud-lv">Lv.1</b><span id="hud-burn" class="burn" hidden>버닝 타임</span><span id="hud-next"></span></div>
      <div class="bar"><i id="hud-bar"></i></div>
    </div>
  </header>

  <nav id="sidetab" class="open">
    <div class="tabs">
      <button id="tab-stats" aria-label="공부 시간과 과목"><img alt=""></button>
      <button id="tab-todo" aria-label="공부 계획표"><img alt=""></button>
      <button id="tab-settings" aria-label="설정"><img alt=""></button>
    </div>
    <button id="tab-toggle" aria-label="메뉴 열고 닫기"><span>‹</span></button>
  </nav>

  <div id="controls">
    <button id="btn-start" class="ctl"><span class="ctl-main">시작</span><span class="ctl-sub"></span></button>
    <button id="btn-rest" class="ctl" disabled><span class="ctl-main">휴식</span></button>
    <button id="btn-end" class="ctl" disabled><span class="ctl-main">끝</span></button>
  </div>

  <!-- screens -->
  <section class="screen" id="scr-select">
    <header class="scr-head"><button class="back" data-back aria-label="뒤로">‹</button><h2>캐릭터 선택</h2></header>
    <div class="scr-body">
      <div class="sel-bubble" id="sel-bubble">마음에 드는 친구를 눌러 봐!</div>
      <div class="sel-row" id="sel-row"></div>
      <div class="sel-info card" id="sel-info" hidden></div>
      <p class="sel-note" id="sel-note" hidden>※ 바꿔도 이전 캐릭터의 데이터는 그대로 남아요.</p>
      <button id="sel-ok" class="btn primary wide" disabled>확인</button>
    </div>
  </section>

  <section class="screen" id="scr-stats">
    <header class="scr-head"><button class="back" data-back aria-label="뒤로">‹</button><h2>통계</h2></header>
    <div class="scr-body" id="stats-body"></div>
  </section>

  <section class="screen" id="scr-todo">
    <header class="scr-head"><button class="back" data-back aria-label="뒤로">‹</button><h2>투두리스트</h2></header>
    <div class="scr-body" id="todo-body"></div>
  </section>

  <section class="screen" id="scr-settings">
    <header class="scr-head"><button class="back" data-back aria-label="뒤로">‹</button><h2>설정</h2></header>
    <div class="scr-body" id="settings-body"></div>
  </section>

  <section class="screen" id="scr-tutorial">
    <header class="scr-head"><button class="back" data-back aria-label="뒤로">‹</button><h2>튜토리얼</h2></header>
    <div class="scr-body" id="tutorial-body"></div>
  </section>

  <section class="screen" id="scr-inventory">
    <header class="scr-head"><button class="back" data-back aria-label="뒤로">‹</button><h2>인벤토리</h2></header>
    <div class="scr-body" id="inventory-body"></div>
  </section>

  <div id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>

  <div id="coach" hidden>
    <div class="coach-dim"></div>
    <div class="coach-card bubble"><p></p><small>눌러서 계속 ▸</small></div>
    <div class="coach-catch"></div>
  </div>

  <div id="toast" hidden></div>
</div>

<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/pet.js"></script>
<script src="js/items.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
